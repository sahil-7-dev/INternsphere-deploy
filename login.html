<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>InternSphere • Access</title>
  <meta
    name="description"
    content="Login or create your InternSphere account to access internships, workrooms, and dashboard tools."
  />

  <link rel="preconnect" href="https://www.gstatic.com" crossorigin />
  <link rel="preconnect" href="https://firestore.googleapis.com" crossorigin />
  <link rel="preconnect" href="https://identitytoolkit.googleapis.com" crossorigin />
  
  <script>(function(){try{var t=localStorage.getItem("theme")||localStorage.getItem("internsphere_theme")||"dark",h=document.documentElement;h.classList.remove("dark","light","theme-dark","theme-light");if(t==="light"){h.classList.add("theme-light","light");h.style.colorScheme="light";h.style.backgroundColor="#f6f8fb"}else{h.classList.add("theme-dark","dark");h.style.colorScheme="dark";h.style.backgroundColor="#111113"}var s=document.createElement("style");s.textContent="html.theme-light body,html.light body{background:#f6f8fb;color:#0f172a}html.theme-dark body,html.dark body{background:#111113;color:rgba(255,255,255,0.95)}";(document.head||document.documentElement).appendChild(s)}catch(e){}})();</script>
  <link rel="stylesheet" href="css/login.css" />
  <link rel="stylesheet" href="css/modern.css" />
  <link rel="stylesheet" href="css/ai-theme.css" />
</head>
<body data-footer="none">
  
  <div class="auth-bg" aria-hidden="true">
    <div class="auth-orb auth-orb--1"></div>
    <div class="auth-orb auth-orb--2"></div>
    <div class="auth-grid"></div>
    
    <div class="auth-dots auth-dots--left">
      <span style="--y: 12%; --d: 0s;"></span>
      <span style="--y: 26%; --d: 1.2s;"></span>
      <span style="--y: 42%; --d: 2.4s;"></span>
      <span style="--y: 58%; --d: 0.8s;"></span>
      <span style="--y: 74%; --d: 3.0s;"></span>
      <span style="--y: 88%; --d: 1.6s;"></span>
    </div>
    <div class="auth-dots auth-dots--right">
      <span style="--y: 16%; --d: 2.0s;"></span>
      <span style="--y: 30%; --d: 0.6s;"></span>
      <span style="--y: 46%; --d: 1.8s;"></span>
      <span style="--y: 62%; --d: 3.2s;"></span>
      <span style="--y: 78%; --d: 1.0s;"></span>
      <span style="--y: 92%; --d: 2.6s;"></span>
    </div>
  </div>

  <main class="page">
    <section class="panel-wrap">

      <aside class="guest-side guest-side--left" aria-label="Try as student">
        <button type="button" class="guest-card guest-card--student guest-try" data-guest-role="student">
          <span class="guest-card__badge">Preview</span>
          <span class="guest-card__icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
              <path d="M22 10v6M2 10l10-5 10 5-10 5z"/><path d="M6 12v5c3 3 9 3 12 0v-5"/>
            </svg>
          </span>
          <span class="guest-card__title">Try as Student</span>
          <span class="guest-card__sub">Browse internships and the dashboard without signing up.</span>
        </button>
      </aside>

      <section class="panel">
        
        <div id="authMsg" class="auth-msg" role="status" aria-live="polite" hidden>
          <span class="auth-msg__text"></span>
          <button class="auth-msg__close" type="button" aria-label="Dismiss">×</button>
        </div>

        <div class="panel-head">
          <a class="panel-brand" href="Index.html" aria-label="InternSphere home">
            <img decoding="async" src="assets/images/Internsphere logo.png" alt="" />
            <span>InternSphere</span>
          </a>
          <div class="panel-title">
            <h2 id="panelTitle">Login • Student</h2>
            <p id="panelDesc">Access your internship dashboard.</p>
          </div>
        </div>

        <div class="role-tabs" role="tablist" aria-label="Choose role">
          <button
            class="role-tab is-active"
            data-role="student"
            role="tab"
            aria-selected="true"
            type="button"
          >
            Student
          </button>
          <button
            class="role-tab"
            data-role="company"
            role="tab"
            aria-selected="false"
            type="button"
          >
            Company
          </button>
        </div>

        <div class="mode-switch" aria-label="Login or Sign up">
          <button class="mode-btn is-active" data-mode="login" aria-pressed="true" type="button">
            Login
          </button>
          <button class="mode-btn" data-mode="signup" aria-pressed="false" type="button">
            Sign up
          </button>
        </div>

        <div class="oauth">
          <button class="btn btn-soft" type="button" id="googleBtn">
            
            <svg class="google-g" viewBox="0 0 18 18" aria-hidden="true">
              <path fill="#4285F4" d="M17.64 9.2045c0-.6381-.0573-1.2518-.1636-1.8409H9v3.4818h4.8436c-.2086 1.125-.8427 2.0782-1.7959 2.7164v2.2581h2.9082c1.7018-1.5668 2.6841-3.874 2.6841-6.6154z"/>
              <path fill="#34A853" d="M9 18c2.43 0 4.4673-.806 5.9564-2.1805l-2.9082-2.2581c-.806.54-1.8368.8595-3.0482.8595-2.3441 0-4.3287-1.5832-5.0364-3.7104H.9573v2.3318C2.4382 15.9832 5.4818 18 9 18z"/>
              <path fill="#FBBC05" d="M3.9636 10.71C3.7841 10.17 3.6818 9.5932 3.6818 9s.1023-1.17.2818-1.71V4.9582H.9573C.3477 6.1731 0 7.5477 0 9s.3477 2.8268.9573 4.0418L3.9636 10.71z"/>
              <path fill="#EA4335" d="M9 3.5795c1.3214 0 2.5077.4541 3.4405 1.3459l2.5813-2.5814C13.4632.8918 11.426 0 9 0 5.4818 0 2.4382 2.0168.9573 4.9582L3.9636 7.29C4.6713 5.1627 6.6559 3.5795 9 3.5795z"/>
            </svg>
            Continue with Google
          </button>
        </div>

        <div class="divider"><span>or continue with email</span></div>

        <form class="form" id="authForm" autocomplete="on">
          <label class="field">
            <span>Email address</span>
            <input type="email" id="email" placeholder="you@example.com" required />
          </label>

          <label class="field">
            <span>Password</span>
            <div class="pwd-wrap">
              <input type="password" id="password" placeholder="Enter your password" required />
              <button type="button" class="pwd-toggle" id="pwdToggle" aria-label="Show password" aria-pressed="false">
                <svg class="pwd-ico pwd-ico--eye" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                  <path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/>
                  <circle cx="12" cy="12" r="3"/>
                </svg>
                <svg class="pwd-ico pwd-ico--eye-off" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                  <path d="M17.94 17.94A10.94 10.94 0 0112 19c-6.5 0-10-7-10-7a19.7 19.7 0 014.22-5.39"/>
                  <path d="M9.9 4.24A10.94 10.94 0 0112 4c6.5 0 10 7 10 7a19.66 19.66 0 01-3.17 4.19"/>
                  <path d="M14.12 14.12a3 3 0 11-4.24-4.24"/>
                  <line x1="2" y1="2" x2="22" y2="22"/>
                </svg>
              </button>
            </div>
          </label>

          <label class="field is-hidden" id="companyNameField">
            <span>Company name</span>
            <input type="text" id="companyName" placeholder="Enter company name" />
          </label>

          <div class="row">
            <label class="check">
              <input type="checkbox" id="remember" />
              <span>Remember me</span>
            </label>

            <button class="link-btn" type="button" id="forgotBtn">Forgot password?</button>
          </div>

          <button class="btn btn-primary" type="submit" id="submitBtn">Login</button>

          <div class="alt-actions">
            <button class="btn btn-ghost" type="button" id="switchBtn">
              Create an account
            </button>
          </div>
        </form>

      </section>

      <aside class="guest-side guest-side--right" aria-label="Try as company">
        <button type="button" class="guest-card guest-card--company guest-try" data-guest-role="company">
          <span class="guest-card__badge">Preview</span>
          <span class="guest-card__icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
              <rect x="3" y="7" width="18" height="13" rx="2"/><path d="M8 7V5a2 2 0 012-2h4a2 2 0 012 2v2M8 13h8M8 17h5"/>
            </svg>
          </span>
          <span class="guest-card__title">Try as Company</span>
          <span class="guest-card__sub">Preview the company dashboard — write actions are disabled.</span>
        </button>
      </aside>

    </section>

  </main>

  <script type="module" src="js/login.js"></script>
  <script src="js/theme.js"></script>
  <script src="js/ui-dynamic.js"></script>
  <script src="js/footer.js"></script>
  <script>
    (function () {
      const btn = document.getElementById("pwdToggle");
      const input = document.getElementById("password");
      if (!btn || !input) return;
      btn.addEventListener("click", () => {
        const showing = input.type === "text";
        input.type = showing ? "password" : "text";
        btn.setAttribute("aria-pressed", showing ? "false" : "true");
        btn.setAttribute("aria-label", showing ? "Show password" : "Hide password");
      });
    })();
  </script>
</body>
</html>
